<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LM 时间线 · 可编辑版</title>
<style>
  body { margin: 0; padding: 24px; background: #fff; color: #111;
         font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  .wrap { max-width: 860px; margin: 0 auto; }
  .tl-help { font-size: 13px; color: #888; border: 1px dashed #bbb; border-radius: 10px;
             padding: 10px 14px; margin-bottom: 16px; line-height: 1.7; }
  .tl-help code { background: rgba(128,128,128,.15); padding: 1px 5px; border-radius: 4px; }

  .tl-add { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
            border: 1px solid #ddd; border-radius: 12px; padding: 12px; }
  .tl-add input[type=date], .tl-add select, .tl-add input[type=text] {
    padding: 7px 10px; border-radius: 10px; border: 1px solid #bbb; background: transparent;
    color: inherit; font-size: 14px; }
  .tl-add input[type=text] { flex: 1; min-width: 200px; }
  .tl-add button, .tl-tool button {
    padding: 7px 14px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff;
    font-size: 14px; cursor: pointer; }
  .tl-tool button.ghost { background: transparent; color: inherit; border-color: #bbb; }
  .tl-tool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .tl-tool .tip { font-size: 12px; color: #999; }

  .tl-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .tl-title { font-size: 17px; font-weight: 500; }
  .tl-count { font-size: 12px; color: #888; margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tl-search { flex: 1; max-width: 220px; padding: 6px 10px; border-radius: 10px;
               border: 1px solid #bbb; background: transparent; font-size: 14px; outline: none; }
  .tl-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tl-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px;
             font-size: 13px; border: 1px solid #ccc; background: transparent; cursor: pointer; }
  .tl-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .tl-chip .n { font-size: 12px; color: #999; }
  .tl-chip.off { opacity: 0.35; }
  .tl-chip.on { border-color: #333; }
  .tl-strip-wrap { overflow-x: auto; border: 1px solid #ccc; border-radius: 12px; padding: 12px 8px 8px; margin-bottom: 16px; }
  .tl-strip { display: flex; min-width: max-content; }
  .tl-month { width: 78px; cursor: pointer; padding: 0 6px; border-left: 1px solid rgba(128,128,128,.25); }
  .tl-month:first-child { border-left: none; }
  .tl-track { position: relative; height: 84px; }
  .tl-mlab { font-size: 12px; text-align: center; padding-top: 6px; border-top: 1px solid #bbb; font-variant-numeric: tabular-nums; }
  .tl-mdots { display: flex; justify-content: center; gap: 3px; padding-top: 4px; min-height: 14px; flex-wrap: wrap; }
  .tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); cursor: pointer; }
  .tl-sect { margin-bottom: 16px; }
  .tl-mh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; position: sticky; top: 0; padding: 4px 0; background: inherit; }
  .tl-mh h3 { font-size: 14px; font-weight: 500; margin: 0; }
  .tl-mh span { font-size: 12px; color: #999; }
  .tl-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 10px; }
  .tl-row:hover { background: rgba(128,128,128,.1); }
  .tl-date { flex: 0 0 52px; font-size: 13px; color: #666; display: flex; align-items: center; gap: 6px; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .tl-date .dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .tl-txt { flex: 1; font-size: 14px; line-height: 21px; }
  .tl-tag { flex: 0 0 auto; font-size: 12px; padding: 2px 8px; border-radius: 6px; color: var(--c);
            background: color-mix(in srgb, var(--c) 14%, transparent); white-space: nowrap; margin-top: 1px; }
  .tl-del { flex: 0 0 auto; border: none; background: transparent; color: #ccc; font-size: 16px;
            cursor: pointer; padding: 0 4px; opacity: 0; }
  .tl-row:hover .tl-del { opacity: 1; }
  .tl-del:hover { color: #ef4444; }
  .tl-empty { text-align: center; color: #888; font-size: 14px; padding: 24px 0; }
  .tl-toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
              background: #111; color: #fff; padding: 8px 18px; border-radius: 8px; font-size: 14px;
              opacity: 0; transition: opacity .25s; pointer-events: none; }
</style>
</head>
<body>
<div class="wrap">

<div class="tl-help">
  <b>使用说明：</b>① 在上方表单选日期、分类、填描述，点「添加」即可记录，数据自动保存在本机；
  ② 点分类标签可筛选，顶部月份条可点击跳转；③ 鼠标移到事件上会出现 × 可删除（手机上长按行再点 ×）；
  ④ 换新设备或想和朋友合并：<b>导出 JSON</b> 发过去，对方点 <b>导入 JSON</b> 选择文件即可合并。
  不确定日期的老数据会显示为「?」。
</div>

<div class="tl-add">
  <input type="date" id="fDate">
  <select id="fCat"></select>
  <input type="text" id="fText" placeholder="事件描述，如：M 发高会，同框合照">
  <button onclick="addEvent()">添加</button>
</div>
<div class="tl-tool">
  <button class="ghost" onclick="exportJSON()">导出 JSON</button>
  <button class="ghost" onclick="document.getElementById('importFile').click()">导入 JSON</button>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importJSON(event)">
  <button class="ghost" onclick="resetAll()">恢复默认数据</button>
  <span class="tip">记录保存在本机浏览器，清理缓存会丢失，重要记录记得导出备份</span>
</div>

<div class="tl-head">
  <span class="tl-title">LM 时间线</span>
  <input class="tl-search" id="tlSearch" placeholder="搜索事件…">
  <span class="tl-count" id="tlCount"></span>
</div>
<div class="tl-chips" id="tlChips"></div>
<div class="tl-strip-wrap"><div class="tl-strip" id="tlStrip"></div></div>
<div id="tlDetail"></div>
</div>

<div class="tl-toast" id="toast"></div>

<script>
/* ========== 分类（可改名称和颜色） ========== */
const CATS = {
  meet:      { label: "同框见面", c: "#3b82f6" },
  online:    { label: "线上营业", c: "#a855f7" },
  conflict:  { label: "矛盾吃醋", c: "#ef4444" },
  travel:    { label: "行程动态", c: "#6b7280" },
  work:      { label: "工作相关", c: "#9ca3af" },
  milestone: { label: "关系节点", c: "#22c55e" },
};

/* ========== 默认数据（首次打开时载入，之后以本机记录为准） ========== */
const DEFAULT_EVENTS = [
  {d:"2025-09-13", cat:"conflict", t:"M 音乐节 IDC，L 疑似拉黑/删了 M"},
  {d:"2025-09-15", cat:"milestone", t:"LM 和好（官宣时提到）"},
  {d:"2025-10-00", cat:"conflict", t:"M 和朋友出去玩，照片有女生 → L 吃醋，急的去 M 家里，亲了"},
  {d:"2025-10-21", cat:"online", t:"L 四代欢乐谷；M 微博发和云朵合照（LM 第一张合照出处，M 裁掉 L 后发布）"},
  {d:"2025-12-11", cat:"work", t:"L 半夜练舞（小星星官摄）"},
  {d:"2025-12-12", cat:"meet", t:"初雪 cha；天魔练习官摄第一次合练（官宣时提到）"},
  {d:"2025-12-13", cat:"meet", t:"L 宿舍练舞：涂唇膏、亲了（被嫌嘴干）"},
  {d:"2025-12-15", cat:"meet", t:"天魔练习官摄合练，双采"},
  {d:"2025-12-16", cat:"online", t:"M 微博发双采造型照片"},
  {d:"2025-12-17", cat:"meet", t:"天魔练习官摄，别人探班，互相叮嘱"},
  {d:"2025-12-18", cat:"work", t:"联排"},
  {d:"2025-12-19", cat:"online", t:"M 微博发熬雪梨汤，ip 海南"},
  {d:"2025-12-20", cat:"work", t:"拍摄族综（12-20 ~ 12-21）"},
  {d:"2025-12-22", cat:"meet", t:"L 主动要合照（隐藏卡），M 发微博照片"},
  {d:"2025-12-25", cat:"meet", t:"LM 联拍（25/26？）"},
  {d:"2025-12-26", cat:"work", t:"新音（12-26 ~ 12-28）"},
  {d:"2026-05-20", cat:"milestone", t:"官宣：朋友圈牵手照，M 全平台营业"},
  {d:"2026-06-14", cat:"meet", t:"L 进京：M 要去青岛拍摄，特意等着见一面再走"},
  {d:"2026-06-15", cat:"travel", t:"M 由助理开车去青岛，迟到了被说"},
  {d:"2026-06-17", cat:"meet", t:"LM 在一起（6-17 ~ 6-19）"},
  {d:"2026-07-30", cat:"travel", t:"LM 不在北京，回重庆？"},
  {d:"2026-08-04", cat:"online", t:"M 发照片（mathinkim 衣服）"},
  {d:"2026-08-12", cat:"conflict", t:"M 录制综艺（电玩城要走，L 生气，后又留下）"},
  {d:"2026-08-13", cat:"meet", t:"L 青岛五公（M 在，8-13 ~ 8-17）"},
  {d:"2026-08-19", cat:"online", t:"M 河北录制厂综；L 发泡泡「七夕快乐」"},
  {d:"2026-08-20", cat:"travel", t:"L 成都逛街：香奈儿 1 戒指 3 耳钉"},
  {d:"2026-08-30", cat:"meet", t:"L 在北京，湖光一号正门接 M 下班"},
  {d:"2026-08-31", cat:"online", t:"M 打耳洞（左边一个）；L 篮球剧第二结局播出，录结局 reaction"},
  {d:"2026-09-01", cat:"online", t:"M 发高会、微博说昨天打了耳洞"},
  {d:"2026-09-12", cat:"online", t:"M 发高会"},
  {d:"2026-09-15", cat:"milestone", t:"M 全平台营业（915 一周年）"},
];

/* ========== 存储与逻辑 ========== */
const KEY = "lm_timeline_v1";
let EVENTS = load();
function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) { const a = JSON.parse(s); if (Array.isArray(a) && a.length) return a; }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_EVENTS));
}
function save() { localStorage.setItem(KEY, JSON.stringify(EVENTS)); }

const on = {}; Object.keys(CATS).forEach(k => on[k] = true);
let query = "";
const ym = d => d.slice(0,7);
const months = () => [...new Set(EVENTS.map(e => ym(e.d)))].sort();
const fmtDate = d => d.slice(5).replace("-", "/").replace("/00", "?");

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 1800);
}

function addEvent() {
  const d = document.getElementById("fDate").value;
  const cat = document.getElementById("fCat").value;
  const t = document.getElementById("fText").value.trim();
  if (!d) { toast("请先选择日期"); return; }
  if (!t) { toast("请填写事件描述"); return; }
  EVENTS.push({d, cat, t});
  EVENTS.sort((a,b) => a.d.localeCompare(b.d));
  save();
  document.getElementById("fText").value = "";
  renderAll();
  toast("已添加 ✓");
}

function delEvent(i) {
  if (!confirm("删除这条记录？")) return;
  EVENTS.splice(i, 1);
  save(); renderAll();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(EVENTS, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "LM时间线_" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  toast("已导出，把文件发给朋友即可");
}

function importJSON(ev) {
  const f = ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const a = JSON.parse(r.result);
      if (!Array.isArray(a)) throw 0;
      const seen = new Set(EVENTS.map(e => e.d + "|" + e.t));
      let n = 0;
      a.forEach(e => {
        if (e && e.d && e.t && CATS[e.cat] && !seen.has(e.d + "|" + e.t)) {
          EVENTS.push({d: e.d, cat: e.cat, t: e.t}); n++;
        }
      });
      EVENTS.sort((x,y) => x.d.localeCompare(y.d));
      save(); renderAll();
      toast(n ? `已合并 ${n} 条新记录` : "没有新记录（可能都已存在）");
    } catch(e) { toast("文件格式不对"); }
  };
  r.readAsText(f);
  ev.target.value = "";
}

function resetAll() {
  if (!confirm("确定清空本机全部记录，恢复默认数据？")) return;
  EVENTS = JSON.parse(JSON.stringify(DEFAULT_EVENTS));
  save(); renderAll();
  toast("已恢复默认");
}

function filtered() {
  return EVENTS.map((e,i) => ({...e, i})).filter(e => on[e.cat] && (!query || e.t.toLowerCase().includes(query)));
}

function renderCatSelect() {
  document.getElementById("fCat").innerHTML =
    Object.entries(CATS).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join("");
}

function renderChips() {
  const box = document.getElementById("tlChips");
  box.innerHTML = "";
  Object.entries(CATS).forEach(([k, v]) => {
    const n = EVENTS.filter(e => e.cat === k).length;
    const b = document.createElement("button");
    b.className = "tl-chip " + (on[k] ? "on" : "off");
    b.innerHTML = `<span class="dot" style="--c:${v.c}"></span>${v.label}<span class="n">${n}</span>`;
    b.onclick = () => { on[k] = !on[k]; renderAll(); };
    box.appendChild(b);
  });
}

function renderStrip(fe) {
  const strip = document.getElementById("tlStrip");
  strip.innerHTML = "";
  months().forEach(m => {
    const evs = fe.filter(e => ym(e.d) === m);
    const col = document.createElement("div");
    col.className = "tl-month";
    const dots = evs.map(e =>
      `<span class="tl-dot" style="--c:${CATS[e.cat].c}" title="${fmtDate(e.d)} · ${e.t.replace(/"/g,"&quot;")}"></span>`
    ).join("");
    col.innerHTML = `<div class="tl-track"><div class="tl-mdots">${dots}</div></div>
      <div class="tl-mlab">${m.slice(2).replace("-","/")}${evs.length ? " · " + evs.length : ""}</div>`;
    col.onclick = () => {
      const el = document.getElementById("sect-" + m);
      if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
    };
    strip.appendChild(col);
  });
}

function renderDetail(fe) {
  const box = document.getElementById("tlDetail");
  box.innerHTML = "";
  const list = months().filter(m => fe.some(e => ym(e.d) === m));
  if (!list.length) {
    box.innerHTML = `<div class="tl-empty">没有匹配的事件，试试调整筛选或搜索词</div>`;
    return;
  }
  list.forEach(m => {
    const evs = fe.filter(e => ym(e.d) === m);
    const sect = document.createElement("div");
    sect.className = "tl-sect";
    sect.id = "sect-" + m;
    let html = `<div class="tl-mh"><h3>${m.slice(0,4)} 年 ${Number(m.slice(5))} 月</h3><span>${evs.length} 条</span></div>`;
    evs.forEach(e => {
      const v = CATS[e.cat];
      html += `<div class="tl-row">
        <span class="tl-date" style="--c:${v.c}"><span class="dot"></span>${fmtDate(e.d)}</span>
        <span class="tl-txt">${e.t}</span>
        <span class="tl-tag" style="--c:${v.c}">${v.label}</span>
        <button class="tl-del" onclick="delEvent(${e.i})" title="删除">×</button>
      </div>`;
    });
    sect.innerHTML = html;
    box.appendChild(sect);
  });
}

function renderAll() {
  const fe = filtered();
  renderChips();
  renderStrip(fe);
  renderDetail(fe);
  document.getElementById("tlCount").textContent = `${fe.length} / ${EVENTS.length} 条`;
}

document.getElementById("fText").addEventListener("keydown", e => {
  if (e.key === "Enter") addEvent();
});
document.getElementById("tlSearch").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  const fe = filtered();
  renderStrip(fe); renderDetail(fe);
  document.getElementById("tlCount").textContent = `${fe.length} / ${EVENTS.length} 条`;
});

renderCatSelect();
document.getElementById("fDate").value = new Date().toISOString().slice(0,10);
renderAll();
</script>
</body>
</html>
